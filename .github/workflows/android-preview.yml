name: Android private calendar preview
on:
  workflow_dispatch:
  push:
    branches: [codex/wechat-calendar-private]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix assistant --ignore-scripts
      - name: Check types and privacy behavior
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native Chinese input and cursor insertion
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.workbench.checkin.InputConnectionTest
      - name: Save native input test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-input-test-results
          path: android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: checkin-private-calendar-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
