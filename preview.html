<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#F2F2F7" />
<title>Do · 打卡工作台 (预览)</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --sub: #8E8E93;
    --line: #E5E5EA;
    --primary: #3B82F6;
    --red: #FF3B30;
    --orange: #FF9500;
    --yellow: #FFCC00;
    --green: #34C759;
    --blue: #5AC8FA;
    --purple: #AF52DE;
    --pink: #FF2D55;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); user-select: none; }
  #app { height: 100%; display: flex; justify-content: center; align-items: stretch; background: #ddd; }
  #app > .phone { width: 100%; max-width: 420px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.1); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .screen.active { opacity: 1; pointer-events: auto; }
  header { padding: 12px 16px 8px; background: var(--bg); flex-shrink: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }
  .scroll::-webkit-scrollbar { display: none; }
  .nav { position: absolute; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--line); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .nav button { flex: 1; padding: 8px 0 6px; background: transparent; border: none; color: #8E8E93; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
  .nav button.active { color: var(--primary); }
  .nav button.active .dot { background: var(--primary); width: 4px; height: 4px; border-radius: 50%; }
  .nav svg { width: 22px; height: 22px; }
  .card { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06); margin-bottom: 10px; }
  .cat-h { padding: 6px 6px; display: flex; align-items: center; gap: 6px; }
  .cat-h .emoji { font-size: 16px; }
  .cat-h .name { font-size: 13px; font-weight: 600; color: #333; }
  .cat-h .count { font-size: 10px; color: #999; margin-left: auto; }
  .task { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-bottom: 8px; display: flex; gap: 10px; }
  .task .left { flex: 1; min-width: 0; }
  .task .time { font-size: 12px; font-weight: 600; color: #555; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .task .title { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 4px; }
  .task .desc { font-size: 11px; color: #888; line-height: 1.4; }
  .task .tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 5px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .check-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; flex-shrink: 0; align-self: flex-start; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .check-btn:active { transform: scale(.92); }
  .check-btn.done { background: var(--green); border-color: var(--green); color: white; animation: pop .35s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .check-btn svg { width: 16px; height: 16px; }
  .pill { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; background: transparent; color: #555; border: none; transition: all .15s; }
  .pill.active { background: var(--primary); color: white; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-top: 8px; }
  .stat { text-align: center; }
  .stat .v { font-size: 18px; font-weight: 700; }
  .stat .v .u { font-size: 10px; color: #888; font-weight: 400; margin-left: 1px; }
  .stat .l { font-size: 10px; color: #888; margin-top: 2px; }
  .heatmap { background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-top: 12px; overflow-x: auto; }
  .heatmap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .heatmap-title { font-size: 13px; font-weight: 600; }
  .heatmap-sub { font-size: 10px; color: #999; }
  .heatmap-grid { display: flex; gap: 3px; }
  .heatmap-day { display: flex; flex-direction: column; gap: 3px; }
  .heatmap-cell { width: 11px; height: 11px; border-radius: 2px; background: #F2F2F7; }
  .heatmap-cell.l1 { background: rgba(59,130,246,.25); }
  .heatmap-cell.l2 { background: rgba(59,130,246,.45); }
  .heatmap-cell.l3 { background: rgba(59,130,246,.7); }
  .heatmap-cell.l4 { background: rgba(59,130,246,.95); }
  .heatmap-cell.today { box-shadow: inset 0 0 0 1px var(--primary); }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 8px; font-size: 10px; color: #888; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .month-cell { aspect-ratio: 1; border-radius: 5px; background: #F2F2F7; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #222; }
  .month-cell.has { background: rgba(59,130,246,.7); color: white; }
  .month-cell.today { box-shadow: inset 0 0 0 1px var(--primary); }
  .month-cell .lunar { font-size: 7px; opacity: .7; }
  .weekday { font-size: 9px; color: #aaa; text-align: center; padding: 2px 0; }
  .donut-row { display: flex; align-items: center; gap: 12px; }
  .donut-legend { flex: 1; font-size: 11px; }
  .donut-legend > div { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .donut-legend .sw { width: 10px; height: 10px; border-radius: 2px; }
  .donut-legend .n { flex: 1; }
  .donut-legend .c { font-weight: 600; }
  .donut-legend .p { color: #888; width: 30px; text-align: right; }
  .btn-icon { width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
  .btn-icon:active { transform: scale(.95); }
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: white; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 100; backdrop-filter: blur(10px); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: none; align-items: flex-end; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 18px 20px; max-height: 80%; overflow-y: auto; animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .input { width: 100%; padding: 10px 12px; border-radius: 10px; background: #F2F2F7; border: none; outline: none; font-size: 14px; margin-bottom: 12px; }
  .input:focus { background: white; box-shadow: 0 0 0 2px rgba(59,130,246,.3); }
  .label { font-size: 11px; color: #888; margin-bottom: 6px; display: block; }
  .row-gap { display: flex; gap: 8px; }
  .row-gap > * { flex: 1; }
  .save-btn { width: 100%; height: 44px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .save-btn:active { transform: scale(.97); }
  .icon-btn { background: transparent; border: none; cursor: pointer; padding: 4px; color: var(--primary); }
  .weekday-row { display: flex; gap: 4px; }
  .weekday-btn { flex: 1; height: 32px; border-radius: 8px; background: #F2F2F7; border: none; font-size: 12px; color: #888; cursor: pointer; }
  .weekday-btn.on { background: var(--primary); color: white; }
  .progress { height: 5px; background: #F2F2F7; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; border-radius: 99px; transition: width .6s; }
  .ring-wrap { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .ring-legend { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; }
  .ring-legend .item { display: flex; align-items: center; gap: 5px; }
  .ring-legend .sw { width: 8px; height: 8px; border-radius: 50%; }
  .ring-legend .n { margin-left: auto; font-weight: 600; }
  .more-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #F8F8F8; cursor: pointer; }
  .more-item:last-child { border-bottom: none; }
  .more-item .ic { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #999; }
  .more-item .lb { flex: 1; font-size: 14px; }
  .more-item .vl { font-size: 12px; color: #888; }
  .more-item.danger { color: var(--red); }
  .more-item.danger .ic { color: var(--red); }
  .empty { text-align: center; padding: 60px 20px; color: #aaa; }
  .empty-icon { width: 60px; height: 60px; border-radius: 50%; background: #f2f2f7; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .line-chart-wrap { padding: 6px 0; }
  .line-chart-wrap svg { width: 100%; height: auto; }
  .tab-pills { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  .tab-pills::-webkit-scrollbar { display: none; }
  .cat-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .cat-row button { padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid #ddd; background: white; cursor: pointer; }
  .cat-row button.on { color: white; border-color: transparent; }
  .cat-grid { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-top: 10px; }
  .cat-row-h { display: flex; padding: 6px 0; gap: 2px; font-size: 10px; color: #888; }
  .cat-row-h > div:first-child { flex: 0 0 70px; }
  .cat-row-h > div { flex: 1; text-align: center; }
  .cat-tr { display: flex; align-items: center; padding: 4px 0; gap: 2px; border-top: 1px solid #F8F8F8; font-size: 12px; }
  .cat-tr .nm { flex: 0 0 70px; color: #333; }
  .cat-tr .cl { flex: 1; display: flex; justify-content: center; }
  .cat-tr .cl > div { width: 22px; height: 22px; border-radius: 5px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #F8F8F8; font-size: 12px; }
  .history-item:last-child { border-bottom: none; }
  .switch { display: inline-block; width: 38px; height: 22px; background: #ddd; border-radius: 99px; position: relative; cursor: pointer; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: var(--primary); }
  .switch.on::after { left: 18px; }
</style>
</head>
<body>
<div id="app">
<div class="phone">

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <header>
    <div class="row" style="justify-content:space-between;">
      <div class="btn-icon" style="background:#DBEAFE;color:var(--primary);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div style="font-size:24px;font-weight:300;letter-spacing:-.5px;">Do</div>
      <button class="btn-icon" onclick="openForm()" style="font-size:18px;color:var(--primary);">+</button>
    </div>
    <div class="row" style="font-size:11px;color:#888;margin-top:8px;">
      <span style="color:#333;font-weight:600;" id="weekdayName">周三</span>
      <span id="dateStr">2025/10/13</span>
      <span style="margin-left:auto;color:#aaa;" id="lunarName">九月廿三</span>
    </div>
    <div class="tab-pills" style="margin-top:10px;">
      <button class="pill active">本日</button>
      <button class="pill">本周</button>
      <button class="pill">当月</button>
      <button class="pill">今年</button>
      <button class="pill">待定</button>
    </div>
    <div style="margin-top:6px;font-size:11px;color:var(--red);">逾期·<b id="overdueCount">0</b></div>
  </header>
  <div class="scroll" id="taskList"></div>
</div>

<!-- LIST SCREEN -->
<div id="list" class="screen">
  <header>
    <div class="row" style="justify-content:space-between;margin-bottom:10px;">
      <h2 style="margin:0;font-size:22px;font-weight:700;">列表</h2>
      <button class="btn-icon" onclick="openForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="row" style="gap:8px;">
      <div style="flex:1;position:relative;">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="搜索任务" class="input" style="padding-left:32px;margin:0;" />
      </div>
    </div>
  </header>
  <div class="scroll" id="listContent"></div>
</div>

<!-- TRENDS SCREEN -->
<div id="trends" class="screen">
  <header>
    <div class="row" style="justify-content:space-between;margin-bottom:8px;">
      <h2 style="margin:0;font-size:22px;font-weight:700;">趋势</h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" width="20" height="20"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="v"><span id="yearCount">0</span><span class="u">次</span></div><div class="l">今年打卡</div></div>
      <div class="stat"><div class="v"><span id="todayCount">0</span><span class="u">次</span></div><div class="l">今日打卡</div></div>
      <div class="stat"><div class="v"><span id="streakCount">0</span><span class="u">天</span></div><div class="l">连续天数</div></div>
    </div>
    <div class="tab-pills">
      <button class="pill active" onclick="setTrendTab('heatmap',this)">日历热力</button>
      <button class="pill" onclick="setTrendTab('cat',this)">分类追踪</button>
      <button class="pill" onclick="setTrendTab('chart',this)">统计图表</button>
    </div>
  </header>
  <div class="scroll">
    <div id="trendHeatmap" class="heatmap" style="margin:12px;">
      <div class="heatmap-header">
        <div class="heatmap-title" id="yearTitle">2025 年</div>
        <div class="heatmap-sub">意念不忘，必有回响</div>
      </div>
      <div id="heatmapContainer" style="overflow-x:auto;"></div>
      <div class="legend">
        <span>少</span>
        <div class="heatmap-cell" style="background:rgba(59,130,246,.15)"></div>
        <div class="heatmap-cell l1"></div>
        <div class="heatmap-cell l2"></div>
        <div class="heatmap-cell l3"></div>
        <div class="heatmap-cell l4"></div>
        <span>多</span>
      </div>
    </div>

    <div id="trendCat" class="cat-grid" style="margin:0 12px;display:none;"></div>

    <div id="trendChart" style="margin:12px;display:none;">
      <div class="card">
        <h4 style="margin:0 0 10px;font-size:13px;">本月每日打卡</h4>
        <div class="line-chart-wrap" id="lineChart"></div>
      </div>
      <div class="card">
        <h4 style="margin:0 0 10px;font-size:13px;">分类占比</h4>
        <div class="donut-row" id="donutChart"></div>
      </div>
    </div>

    <div id="trendMonth" style="padding:0 12px;">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:6px;">
          <div style="font-weight:600;font-size:13px;" id="monthTitle">2025 年 10 月</div>
          <div style="font-size:10px;color:#aaa;">轻触查看</div>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- MORE SCREEN -->
<div id="more" class="screen">
  <header><h2 style="margin:0;font-size:22px;font-weight:700;">更多</h2></header>
  <div class="scroll" style="padding:0 12px 80px;">
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="more-item">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1"/></svg></div>
        <div class="lb">坚持打卡</div>
        <div class="vl" id="moreStreak">0 天</div>
      </div>
      <div class="more-item">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></div>
        <div class="lb">数据统计</div>
        <div class="vl" id="moreStats">0 条记录</div>
      </div>
      <div class="more-item" onclick="alert('导出功能开发中')">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="lb">导出数据</div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="more-item" onclick="toggleWeekStart()">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="lb">一周起始日</div>
        <div class="vl" id="weekStartLabel">周一</div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="more-item" onclick="showAbout()">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>
        <div class="lb">关于 Do</div>
      </div>
      <div class="more-item danger" onclick="resetData()">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
        <div class="lb">重置数据</div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:#aaa;padding:16px 0;">Do · 打卡工作台 v1.0</div>
  </div>
</div>

<!-- FORM MODAL -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 id="formTitle" style="margin:0;">新任务</h3>
      <button class="icon-btn" onclick="closeForm()" style="color:#888;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <label class="label">任务标题</label>
    <input id="fTitle" class="input" placeholder="如：阅读 30 分钟" />
    <label class="label">备注</label>
    <input id="fDesc" class="input" placeholder="补充说明（可选）" />
    <label class="label">分类</label>
    <div class="cat-row" id="fCats"></div>
    <div class="row-gap">
      <div>
        <label class="label">计划时间</label>
        <input id="fTime" type="time" class="input" value="09:00" />
      </div>
      <div>
        <label class="label">目标数值</label>
        <input id="fTarget" type="number" class="input" placeholder="可选" />
      </div>
    </div>
    <label class="label">重复</label>
    <div class="weekday-row" id="fDays"></div>
    <button class="save-btn" onclick="saveForm()">保存</button>
  </div>
</div>

<!-- TOAST -->

<script>
// ====== DATA LAYER ======
const KEYS = { tasks: 'wb.tasks', records: 'wb.records', cats: 'wb.cats', settings: 'wb.settings' };
const DEFAULT_CATS = [
  { id: 'morning', name: '上午', emoji: '🌅', color: '#FF9500' },
  { id: 'noon', name: '下午', emoji: '☀️', color: '#FFCC00' },
  { id: 'work', name: '工作', emoji: '💼', color: '#FF3B30' },
  { id: 'evening', name: '晚上', emoji: '🌙', color: '#AF52DE' },
  { id: 'life', name: '生活', emoji: '🍳', color: '#34C759' },
  { id: 'study', name: '阅读', emoji: '📚', color: '#5AC8FA' },
  { id: 'rest', name: '休息', emoji: '😴', color: '#FF2D55' },
  { id: 'invest', name: '投资', emoji: '💰', color: '#FF9500' },
];

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function uid(p) { return p + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6); }
function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

// Lunar calc (simplified)
const LUNAR_INFO = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x0d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63];
function lYd(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)if(LUNAR_INFO[y-1900]&i)s++;return s+lD(y);}
function lM(y){return LUNAR_INFO[y-1900]&0xf;}
function lD(y){if(lM(y)===0)return 0;return(LUNAR_INFO[y-1900]&0x10000)?30:29;}
function mD(y,m){return(LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function toLunar(d){let o=Math.floor((d.getTime()-new Date(1900,0,31).getTime())/86400000);let y=1900,t=0;for(;y<2100&&o>0;y++){t=lYd(y);if(o<t)break;o-=t;}const l=lM(y);let il=false,lm=1;for(;lm<13&&o>=0;lm++){if(l>0&&lm===l+1&&!il){lm--;il=true;t=lD(y);}else t=mD(y,lm);if(il&&lm===l+1)il=false;if(o<t)break;o-=t;}const ld=o+1;const mCN=['正','二','三','四','五','六','七','八','九','十','冬','腊'];const dCN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];const mN=(il?'闰':'')+mCN[lm-1]+'月';return ld===1?mN:dCN[ld-1];}

// State
let state = {
  tasks: load(KEYS.tasks, null),
  records: load(KEYS.records, null),
  cats: load(KEYS.cats, DEFAULT_CATS),
  settings: load(KEYS.settings, { weekStartDay: 1 }),
  editingTaskId: null,
  formCat: 'morning',
  formDays: [1,2,3,4,5],
};

// Init seed data
if (!state.tasks) {
  const now = Date.now();
  const day = 86400000;
  state.tasks = [
    { id:'t1', title:'睡觉 8 小时', description:'每晚 10 点睡觉，6 点起，养成好习惯', categoryId:'rest', scheduledTime:'22:00', isRecurring:true, weekdays:[0,1,2,3,4,5,6], createdAt: now-90*day, updatedAt: now },
    { id:'t2', title:'规整纳指盘写', description:'小投资', categoryId:'invest', scheduledTime:'11:00', isRecurring:true, weekdays:[1,2,3,4,5], createdAt: now-60*day, updatedAt: now },
    { id:'t3', title:'全家打扫卫生', description:'打扫顺序：卧室-客厅-阳台-厕所', categoryId:'life', scheduledTime:'15:00', isRecurring:true, weekdays:[0,6], createdAt: now-30*day, updatedAt: now },
    { id:'t4', title:'阅读', description:'本月目标 1000 页', categoryId:'study', scheduledTime:'17:00', isRecurring:true, weekdays:[0,1,2,3,4,5,6], target:1000, unit:'页', createdAt: now-30*day, updatedAt: now },
    { id:'t5', title:'简单锻炼', description:'跳绳、俯卧撑、仰卧起坐', categoryId:'evening', scheduledTime:'20:00', isRecurring:true, weekdays:[0,1,2,3,4,5,6], target:22, unit:'个', createdAt: now-30*day, updatedAt: now },
    { id:'t6', title:'成长提升', description:'学习新知识，反思总结', categoryId:'morning', scheduledTime:'23:30', isRecurring:true, weekdays:[0,1,2,3,4,5,6], createdAt: now-30*day, updatedAt: now },
    { id:'t7', title:'工作 - 文档撰写', description:'每日工作日报', categoryId:'work', scheduledTime:'09:00', isRecurring:true, weekdays:[1,2,3,4,5], createdAt: now-30*day, updatedAt: now },
  ];
  save(KEYS.tasks, state.tasks);
}

if (!state.records) {
  const now = Date.now();
  const day = 86400000;
  const recs = [];
  for (let i = 90; i >= 0; i--) {
    const d = new Date(now - i*day);
    const dow = d.getDay();
    const ds = fmtDate(d);
    state.tasks.forEach(t => {
      if (t.weekdays && !t.weekdays.includes(dow)) return;
      if (Math.random() < 0.8) {
        const t2 = new Date(d);
        const [hh,mm] = (t.scheduledTime || '09:00').split(':').map(Number);
        t2.setHours(hh + Math.floor(Math.random()*3), mm, Math.floor(Math.random()*60));
        recs.push({ id:'r-'+t.id+'-'+i, taskId:t.id, taskTitle:t.title, categoryId:t.categoryId, date:ds, completedAt:t2.getTime(), durationSeconds:60+Math.floor(Math.random()*300), progress:t.target?Math.floor(Math.random()*(t.target/30))+1:undefined, progressTotal:t.target });
      }
    });
  }
  state.records = recs;
  save(KEYS.records, state.records);
}

// ====== HELPERS ======
function getTodayTasks() {
  const today = new Date();
  const ds = fmtDate(today);
  const dow = today.getDay();
  return state.tasks
    .filter(t => !t.archivedAt)
    .filter(t => !t.isRecurring || !t.weekdays || t.weekdays.length===0 || t.weekdays.includes(dow))
    .map(t => {
      const rec = state.records.find(r => r.taskId===t.id && r.date===ds);
      return { ...t, completed: !!rec, record: rec };
    })
    .sort((a,b) => (a.scheduledTime||'99:99').localeCompare(b.scheduledTime||'99:99'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ====== RENDER HOME ======
function renderHome() {
  const today = new Date();
  const weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('weekdayName').textContent = weekdayNames[today.getDay()];
  document.getElementById('dateStr').textContent = today.getFullYear()+'/'+pad(today.getMonth()+1)+'/'+pad(today.getDate());
  document.getElementById('lunarName').textContent = toLunar(today);

  const tasks = getTodayTasks();
  const now = Date.now();
  let overdue = 0;
  const groups = {};
  tasks.forEach(t => {
    if (!t.completed && t.scheduledTime) {
      const [hh,mm] = t.scheduledTime.split(':').map(Number);
      const s = new Date(now);
      s.setHours(hh,mm,0,0);
      if (s.getTime() < now) overdue++;
    }
    const c = state.cats.find(x => x.id === t.categoryId);
    const key = c ? c.id : 'other';
    if (!groups[key]) groups[key] = { cat: c, items: [] };
    groups[key].items.push(t);
  });
  document.getElementById('overdueCount').textContent = overdue;

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const keys = Object.keys(groups);
  if (keys.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div>今天还没有任务</div><button onclick="openForm()" style="margin-top:14px;padding:8px 18px;background:var(--primary);color:white;border:none;border-radius:99px;font-size:13px;">添加一个</button></div>';
    return;
  }
  keys.forEach(k => {
    const g = groups[k];
    const sec = document.createElement('div');
    sec.style.marginBottom = '16px';
    sec.innerHTML = `<div class="cat-h"><span class="emoji">${g.cat ? g.cat.emoji : '📌'}</span><span class="name">${g.cat ? g.cat.name : '其他'}</span><span class="count">${g.items.filter(i=>i.completed).length}/${g.items.length}</span></div>`;
    g.items.forEach(t => {
      const node = renderTaskCard(t, g.cat);
      sec.appendChild(node);
    });
    list.appendChild(sec);
  });
}

function renderTaskCard(t, cat) {
  const wrap = document.createElement('div');
  wrap.className = 'task';
  if (t.completed) {
    wrap.innerHTML = `
      <div style="flex:1;min-width:0;">
        <div class="row" style="justify-content:space-between;margin-bottom:6px;">
          <div class="time">${t.scheduledTime||''} ${t.isRecurring ? '↻' : ''}</div>
          <div class="check-btn done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg></div>
        </div>
        <div class="title">${t.title}</div>
        ${t.description ? `<div class="desc">${t.description}</div>` : ''}
      </div>`;
  } else {
    const isOverdue = (() => {
      if (!t.scheduledTime) return false;
      const [hh,mm] = t.scheduledTime.split(':').map(Number);
      const s = new Date();
      s.setHours(hh,mm,0,0);
      return s.getTime() < Date.now();
    })();
    wrap.innerHTML = `
      <div class="left">
        <div class="time" style="${isOverdue?'color:var(--red);':''}">
          ${t.scheduledTime||''}
          ${isOverdue ? '<span style="background:#FEE;color:var(--red);font-size:9px;padding:1px 4px;border-radius:3px;margin-left:4px;">逾期</span>' : ''}
        </div>
        <div class="title">${t.title}</div>
        ${t.description ? `<div class="desc">${t.description}</div>` : ''}
        <div class="tags">
          ${cat ? `<span class="tag" style="background:${cat.color}22;color:${cat.color};"><span>${cat.emoji}</span>${cat.name}</span>` : ''}
          ${t.isRecurring ? '<span class="tag" style="background:#F2F2F7;color:#666;">每日</span>' : ''}
          ${t.target ? `<span class="tag" style="background:#FFF5E5;color:#FF9500;">目标 ${t.target}${t.unit||''}</span>` : ''}
        </div>
      </div>
      <button class="check-btn" onclick="checkIn('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg></button>
    `;
  }
  return wrap;
}

function checkIn(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const now = Date.now();
  state.records.unshift({
    id: uid('r'), taskId: t.id, taskTitle: t.title, categoryId: t.categoryId,
    date: fmtDate(new Date(now)), completedAt: now, durationSeconds: 0,
    progress: t.target ? Math.min(t.target, 1) : undefined,
    progressTotal: t.target,
  });
  save(KEYS.records, state.records);
  renderHome();
  renderList();
  renderTrends();
  renderMore();
  showToast('✓ 已打卡');
}

// ====== LIST SCREEN ======
function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const tasks = state.tasks.filter(t => !t.archivedAt).filter(t => !q || t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q));
  const todayRec = state.records.filter(r => r.date === fmtDate(new Date()));
  const list = document.getElementById('listContent');
  list.innerHTML = '';
  if (todayRec.length) {
    const head = document.createElement('div');
    head.style.padding = '0 4px 8px';
    head.innerHTML = `<div style="font-size:11px;color:#888;margin-bottom:6px;">今天已打卡 ${todayRec.length} 项</div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;">${todayRec.map(r => {
      const c = state.cats.find(x=>x.id===r.categoryId);
      return `<span style="flex-shrink:0;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:500;background:${c?c.color+'22':'#F2F2F7'};color:${c?c.color:'#666'};">✓ ${r.taskTitle}</span>`;
    }).join('')}</div>`;
    list.appendChild(head);
  }
  tasks.forEach(t => {
    const cat = state.cats.find(x=>x.id===t.categoryId);
    const isDone = todayRec.some(r=>r.taskId===t.id);
    const node = document.createElement('div');
    node.className = 'task';
    node.style.margin = '0 0 8px';
    node.innerHTML = `
      <button class="check-btn ${isDone?'done':''}" ${isDone?'disabled':''} onclick="${isDone?'':`checkIn('${t.id}')`}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="left">
        <div class="time">${t.scheduledTime||'—'} ${t.isRecurring?'↻':''}</div>
        <div class="title">${t.title}</div>
        ${t.description?`<div class="desc">${t.description}</div>`:''}
        <div class="tags">
          ${cat?`<span class="tag" style="background:${cat.color}22;color:${cat.color};">${cat.emoji} ${cat.name}</span>`:''}
          ${t.target?`<span class="tag" style="background:#FFF5E5;color:#FF9500;">目标 ${t.target}${t.unit||''}</span>`:''}
        </div>
      </div>`;
    list.appendChild(node);
  });
}

// ====== TRENDS SCREEN ======
function renderTrends() {
  const today = new Date();
  const year = today.getFullYear();
  const ymap = {};
  state.records.forEach(r => {
    const yk = r.date.slice(0,4);
    if (yk === String(year)) ymap[r.date] = (ymap[r.date]||0)+1;
  });
  const todayCount = ymap[fmtDate(today)] || 0;
  document.getElementById('yearCount').textContent = Object.values(ymap).reduce((a,b)=>a+b,0);
  document.getElementById('todayCount').textContent = todayCount;
  document.getElementById('streakCount').textContent = streakDays(ymap);
  document.getElementById('yearTitle').textContent = year + ' 年';
  document.getElementById('monthTitle').textContent = year + ' 年 ' + (today.getMonth()+1) + ' 月';
  document.getElementById('weekStartLabel').textContent = state.settings.weekStartDay===1?'周一':'周日';

  // Heatmap
  const container = document.getElementById('heatmapContainer');
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31);
  const allDays = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) allDays.push(new Date(d));
  const fd = start.getDay();
  const padBefore = fd === 0 ? 6 : fd - 1;
  const padded = [...Array(padBefore).fill(null), ...allDays];
  const weeks = [];
  for (let i = 0; i < padded.length; i += 7) weeks.push(padded.slice(i, i+7));
  const todayStr = fmtDate(today);
  const max = Math.max(...Object.values(ymap), 1);
  let html = '<div style="display:flex;gap:3px;"><div style="display:flex;flex-direction:column;gap:3px;font-size:9px;color:#aaa;margin-right:2px;">';
  ['一','','三','','五',''].forEach((d,i) => { html += `<div style="height:11px;line-height:11px;">${d}</div>`; });
  html += '</div><div style="display:flex;gap:3px;">';
  weeks.forEach(week => {
    html += '<div style="display:flex;flex-direction:column;gap:3px;">';
    week.forEach(d => {
      if (!d) { html += '<div style="width:11px;height:11px;"></div>'; return; }
      const ds = fmtDate(d);
      const c = ymap[ds] || 0;
      const cls = c === 0 ? '' : (c/max > 0.75 ? 'l4' : c/max > 0.5 ? 'l3' : c/max > 0.25 ? 'l2' : 'l1');
      const isToday = ds === todayStr;
      html += `<div class="heatmap-cell ${cls} ${isToday?'today':''}" title="${ds}: ${c} 次" style="cursor:pointer;"></div>`;
    });
    html += '</div>';
  });
  html += '</div></div>';
  container.innerHTML = html;

  // Month grid
  const monthGrid = document.getElementById('monthGrid');
  const y2 = today.getFullYear(), m2 = today.getMonth();
  const dim = new Date(y2, m2+1, 0).getDate();
  const fd2 = new Date(y2, m2, 1).getDay();
  const sp2 = fd2 === 0 ? 6 : fd2 - 1;
  let mhtml = '<div class="month-grid" style="margin-bottom:6px;">';
  ['一','二','三','四','五','六','日'].forEach(d => mhtml += `<div class="weekday">${d}</div>`);
  mhtml += '</div><div class="month-grid">';
  for (let i = 0; i < sp2; i++) mhtml += '<div></div>';
  for (let day = 1; day <= dim; day++) {
    const ds = `${y2}-${pad(m2+1)}-${pad(day)}`;
    const isToday = today.getDate()===day && today.getMonth()===m2;
    const c = ymap[ds] || 0;
    const ld = toLunar(new Date(y2, m2, day));
    mhtml += `<div class="month-cell ${c?'has':''} ${isToday?'today':''}"><div>${day}</div><div class="lunar">${ld}</div></div>`;
  }
  mhtml += '</div>';
  monthGrid.innerHTML = mhtml;

  // Cat heatmap
  renderCatGrid();

  // Line chart
  const days = [];
  for (let d = 1; d <= dim; d++) days.push({ date: `${y2}-${pad(m2+1)}-${pad(d)}`, count: ymap[`${y2}-${pad(m2+1)}-${pad(d)}`] || 0 });
  const max2 = Math.max(...days.map(d=>d.count), 1);
  const w = 320, hh2 = 140, p2 = { l: 24, r: 12, t: 12, b: 24 };
  const wd = w - p2.l - p2.r, hd = hh2 - p2.t - p2.b;
  const stepX = wd / Math.max(1, days.length - 1);
  const pts = days.map((d, i) => ({ x: p2.l + i*stepX, y: p2.t + hd - (d.count/max2)*hd }));
  const pathD = pts.map((pt, i) => `${i===0?'M':'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ');
  const fillD = pathD + ` L ${pts[pts.length-1].x.toFixed(1)} ${p2.t+hd} L ${pts[0].x.toFixed(1)} ${p2.t+hd} Z`;
  document.getElementById('lineChart').innerHTML = `
    <svg viewBox="0 0 ${w} ${hh2}" preserveAspectRatio="xMidYMid meet" style="width:100%;">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
      ${[0,.25,.5,.75,1].map(pp => `<line x1="${p2.l}" y1="${p2.t+hd*pp}" x2="${p2.l+wd}" y2="${p2.t+hd*pp}" stroke="#F2F2F7" stroke-width="1"/>`).join('')}
      <path d="${fillD}" fill="url(#lg)"/>
      <path d="${pathD}" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(pt => `<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="#3B82F6"/>`).join('')}
    </svg>`;

  // Donut
  const counts = {};
  state.records.forEach(r => counts[r.categoryId] = (counts[r.categoryId]||0)+1);
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const data = state.cats.map(c => ({ ...c, count: counts[c.id]||0, pct: total>0 ? (counts[c.id]||0)/total : 0 })).filter(d=>d.count>0).sort((a,b)=>b.count-a.count);
  const sz = 140, r = 50, sw = 16, circ = 2*Math.PI*r;
  let off = 0;
  let rings = `<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#F2F2F7" stroke-width="${sw}"/>`;
  data.forEach(d => {
    const len = d.pct * circ;
    rings += `<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${len} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`;
    off += len;
  });
  rings += `<text x="${sz/2}" y="${sz/2 - 4}" font-size="22" font-weight="700" fill="#1C1C1E" text-anchor="middle">${total}</text><text x="${sz/2}" y="${sz/2 + 14}" font-size="10" fill="#8E8E93" text-anchor="middle">总打卡</text>`;
  document.getElementById('donutChart').innerHTML = `
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${rings}</svg>
    <div class="donut-legend">
      ${data.slice(0,6).map(d => `<div><span class="sw" style="background:${d.color};"></span><span class="n">${d.emoji} ${d.name}</span><span class="c">${d.count}</span><span class="p">${(d.pct*100).toFixed(0)}%</span></div>`).join('')}
    </div>`;
}

function streakDays(data) {
  let s = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const k = fmtDate(d);
    if (data[k]) s++;
    else { if (i===0) continue; break; }
  }
  return s;
}

function renderCatGrid() {
  const start = new Date();
  start.setDate(start.getDate() - 6);
  const dates = [];
  for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(d.getDate()+i); dates.push(d); }
  const dks = dates.map(fmtDate);
  const cgr = document.getElementById('trendCat');
  let html = '<div class="cat-row-h"><div>分类</div>';
  ['一','二','三','四','五','六','日'].forEach((w, i) => {
    const d = dates[i];
    const isT = fmtDate(new Date()) === fmtDate(d);
    html += `<div><div style="color:#aaa;font-size:9px;">${w}</div><div style="color:${isT?'var(--primary)':'#333'};font-weight:${isT?'700':'400'};">${d.getDate()}</div></div>`;
  });
  html += '</div>';
  state.cats.forEach(c => {
    const taskSet = new Set(state.records.filter(r=>r.categoryId===c.id).map(r=>r.taskId));
    html += `<div class="cat-tr"><div class="nm"><span style="margin-right:3px;">${c.emoji}</span>${c.name}</div>`;
    dks.forEach(dk => {
      const recs = state.records.filter(r => r.categoryId===c.id && r.date===dk);
      const fill = recs.length > 0;
      html += `<div class="cl"><div style="background:${fill?c.color:'#F2F2F7'};opacity:${fill?1:.4};"></div></div>`;
    });
    html += '</div>';
  });
  cgr.innerHTML = html;
}

// ====== MORE SCREEN ======
function renderMore() {
  document.getElementById('moreStreak').textContent = streakDays((() => {
    const m = {};
    state.records.forEach(r => m[r.date] = (m[r.date]||0)+1);
    return m;
  })()) + ' 天';
  document.getElementById('moreStats').textContent = `${state.records.length} 条记录 / ${state.tasks.length} 项任务`;
}

function toggleWeekStart() {
  state.settings.weekStartDay = state.settings.weekStartDay === 1 ? 0 : 1;
  save(KEYS.settings, state.settings);
  renderTrends();
  showToast('已切换');
}

function showAbout() {
  alert('Do · 打卡工作台 v1.0\n\n一款轻量级的日常打卡应用\n\n· 时间线任务管理\n· 分类追踪 + 农历日历\n· 年度热力图 / 月度日历 / 环形图\n· 数据本地存储，隐私安全');
}

function resetData() {
  if (confirm('确定要清空数据并恢复初始示例吗？')) {
    localStorage.removeItem(KEYS.tasks);
    localStorage.removeItem(KEYS.records);
    location.reload();
  }
}

// ====== FORM ======
function openForm() {
  document.getElementById('formModal').classList.add('show');
  document.getElementById('formTitle').textContent = state.editingTaskId ? '编辑任务' : '新任务';
  // cats
  const cats = document.getElementById('fCats');
  cats.innerHTML = state.cats.map(c => `<button data-id="${c.id}" style="background:${state.formCat===c.id?c.color:'white'};color:${state.formCat===c.id?'white':'#333'};">${c.emoji} ${c.name}</button>`).join('');
  cats.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      state.formCat = b.dataset.id;
      cats.querySelectorAll('button').forEach(x => {
        const c = state.cats.find(cc => cc.id === x.dataset.id);
        x.style.background = state.formCat === c.id ? c.color : 'white';
        x.style.color = state.formCat === c.id ? 'white' : '#333';
      });
    };
  });
  // days
  const days = document.getElementById('fDays');
  const labels = [{v:1,l:'一'},{v:2,l:'二'},{v:3,l:'三'},{v:4,l:'四'},{v:5,l:'五'},{v:6,l:'六'},{v:0,l:'日'}];
  days.innerHTML = labels.map(d => `<button class="${state.formDays.includes(d.v)?'on':''}" data-v="${d.v}">${d.l}</button>`).join('');
  days.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const v = +b.dataset.v;
      if (state.formDays.includes(v)) state.formDays = state.formDays.filter(x => x !== v);
      else state.formDays = [...state.formDays, v].sort();
      b.classList.toggle('on');
    };
  });
  // fields
  const t = state.editingTaskId ? state.tasks.find(x => x.id === state.editingTaskId) : null;
  document.getElementById('fTitle').value = t ? t.title : '';
  document.getElementById('fDesc').value = t ? (t.description || '') : '';
  document.getElementById('fTime').value = t ? (t.scheduledTime || '09:00') : '09:00';
  document.getElementById('fTarget').value = t && t.target ? t.target : '';
  state.formCat = t ? t.categoryId : 'morning';
  state.formDays = t && t.weekdays ? t.weekdays : [1,2,3,4,5];
}

function closeForm() {
  document.getElementById('formModal').classList.remove('show');
  state.editingTaskId = null;
}

function saveForm() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('请填写标题'); return; }
  const desc = document.getElementById('fDesc').value.trim();
  const time = document.getElementById('fTime').value;
  const target = document.getElementById('fTarget').value;
  const data = {
    title, description: desc || undefined,
    categoryId: state.formCat,
    scheduledTime: time,
    isRecurring: true,
    weekdays: state.formDays,
    target: target ? Number(target) : undefined,
    unit: target ? '页' : undefined,
  };
  if (state.editingTaskId) {
    const t = state.tasks.find(x => x.id === state.editingTaskId);
    Object.assign(t, data, { updatedAt: Date.now() });
    showToast('已更新');
  } else {
    state.tasks.unshift({ id: uid('t'), ...data, createdAt: Date.now(), updatedAt: Date.now() });
    showToast('已添加');
  }
  save(KEYS.tasks, state.tasks);
  closeForm();
  renderHome();
  renderList();
  renderTrends();
  renderMore();
}

// ====== NAV ======
function switchTab(tab, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.remove('active');
    b.innerHTML = b.innerHTML.replace(/<div class="dot"[^>]*><\/div>/g, '');
  });
  btn.classList.add('active');
  btn.insertAdjacentHTML('afterbegin', '<div class="dot"></div>');
  if (tab === 'trends') renderTrends();
  if (tab === 'more') renderMore();
  if (tab === 'list') renderList();
  if (tab === 'home') renderHome();
}

function setTrendTab(tab, btn) {
  document.querySelectorAll('#trends .pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('trendHeatmap').style.display = tab==='heatmap'?'block':'none';
  document.getElementById('trendCat').style.display = tab==='cat'?'block':'none';
  document.getElementById('trendChart').style.display = tab==='chart'?'block':'none';
  document.getElementById('trendMonth').style.display = tab==='heatmap'?'block':'none';
}

// ====== INIT ======
document.addEventListener('DOMContentLoaded', () => {
  renderHome();
  renderList();
  renderTrends();
  renderMore();
  document.getElementById('searchInput').addEventListener('input', renderList);
});
</script>
